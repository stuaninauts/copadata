version = 1

# Code and docs: MIT.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Eduardo Stuani"
SPDX-License-Identifier = "MIT"

# Public data export: derived from the Fjelstul World Cup Database, so CC-BY-SA 4.0 (ADR 0005, 0006).
[[annotations]]
path = "web/public/data/**"
precedence = "override"
SPDX-FileCopyrightText = ["2023 Joshua C. Fjelstul", "2026 Eduardo Stuani"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Site content (texts that cite the export): CC-BY-SA 4.0 like the rest of the subdomain's content (ADR 0007, 0010).
[[annotations]]
path = ["web/src/content/**", "web/public/og.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Eduardo Stuani"
SPDX-License-Identifier = "CC-BY-SA-4.0"
