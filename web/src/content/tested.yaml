# Todas as frases testadas, nas duas levas (ADR 0008), para a página de Método.
# As publicadas tiram o veredito do export (myth); as demais repetem o registro do ADR 0008 (verdict).
# Conteúdo sob CC-BY-SA 4.0 (REUSE.toml).

- { id: l1-01-first-goal, batch: 1, verdict: myth, claim: { pt: "O primeiro gol vale mais no mata-mata.", en: "The first goal is worth more in the knockout." }, note: { pt: "Fora do site: diferença pequena e leitura confusa (vencer aos 90' ou avançar).", en: "Not on the site: a small gap and a confusing reading (winning at 90 or going through)." } }
- { id: l1-02-two-nil, batch: 1, myth: two_nil, claim: { pt: "2 a 0 é o placar mais perigoso.", en: "2-0 is the most dangerous lead." } }
- { id: l1-03-half-time, batch: 1, verdict: undecided, claim: { pt: "O pior momento para sofrer gol é no fim do 1º tempo.", en: "The worst time to concede is just before half-time." }, note: { pt: "Fora do site: inconclusivo.", en: "Not on the site: inconclusive." } }
- { id: l1-04-late-equalizer, batch: 1, verdict: undecided, claim: { pt: "Quem empata no fim ganha a prorrogação.", en: "A late equalizer wins you extra time." }, note: { pt: "Fora do site: inconclusivo, com só 37 casos.", en: "Not on the site: inconclusive, with only 37 cases." } }
- { id: l1-05-vulnerable, batch: 1, verdict: myth, claim: { pt: "Depois de marcar, o time fica vulnerável.", en: "A team is vulnerable right after scoring." }, note: { pt: "Fora do site: efeito fraco, e as duas metades da história discordam.", en: "Not on the site: a weak effect, and the two halves of the history disagree." } }
- { id: l1-06-leader, batch: 1, myth: leader_sits_back, claim: { pt: "Quem está ganhando por 1 recua.", en: "A team leading by one sits back." } }
- { id: l1-07-goals-cluster, batch: 1, verdict: myth, claim: { pt: "Gol chama gol.", en: "Goals come in clusters." }, note: { pt: "Fora do site: o resultado depende de explicar a pausa da nova saída de bola.", en: "Not on the site: the result hinges on explaining the restart after a goal." } }
- { id: l1-08-play-for-draw, batch: 1, verdict: myth_borderline, claim: { pt: "No mata-mata os times jogam pelo empate.", en: "Knockout teams play for the draw." }, note: { pt: "Fora do site: mensagem ambígua.", en: "Not on the site: an ambiguous message." } }
- { id: l1-09-season, batch: 1, myth: season_outlier, claim: { pt: "2026 foi uma Copa fora da curva.", en: "2026 was an outlier World Cup." }, note: { pt: "No site como \"O que 2026 teve de diferente\".", en: "On the site as \"What was new in 2026\"." } }
- { id: l1-10-tighter, batch: 1, verdict: myth, claim: { pt: "O futebol ficou mais travado.", en: "Football has become tighter." }, note: { pt: "Fora do site: dependia da montanha-russa, que não foi publicada.", en: "Not on the site: it depended on the roller-coaster claim, which was not published." } }
- { id: l1-11-specialists, batch: 1, myth: late_specialists, claim: { pt: "Tem seleção especialista em decidir no fim.", en: "Some teams are specialists in deciding late." } }
- { id: l1-12-opener, batch: 1, myth: opener_loss, claim: { pt: "Perdeu a estreia, está fora (e o formato de 48 aliviou).", en: "Lose the opener and you are out (and the 48-team format eased it)." } }
- { id: l2-01-lottery, batch: 2, verdict: undecided, claim: { pt: "Pênalti é loteria.", en: "Penalties are a lottery." }, note: { pt: "Fora do site: o favorito vence pouco mais da metade das disputas, perto demais de 50% para afirmar.", en: "Not on the site: the favorite wins just over half of shootouts, too close to 50% to call." } }
- { id: l2-02-first-kicker, batch: 2, verdict: undecided, claim: { pt: "Quem bate primeiro na disputa leva vantagem.", en: "Kicking first in a shootout is an advantage." }, note: { pt: "Fora do site: inconclusivo.", en: "Not on the site: inconclusive." } }
- { id: l2-03-favorite, batch: 2, myth: favorite_knockout, claim: { pt: "Na Copa, o favorito sofre mais no mata-mata.", en: "At the World Cup, the favorite struggles in the knockout." } }
- { id: l2-04-unpredictable, batch: 2, verdict: undecided, claim: { pt: "A Copa ficou mais imprevisível.", en: "The World Cup has become less predictable." }, note: { pt: "Fora do site: inconclusivo.", en: "Not on the site: inconclusive." } }
- { id: l2-05-weak-teams, batch: 2, verdict: true_borderline, claim: { pt: "As goleadas de 2026 vêm das seleções fracas.", en: "2026's big wins came from weaker teams." }, note: { pt: "Fora do site: a força explica pouco do salto; aparece como ressalva em \"O que 2026 teve de diferente\".", en: "Not on the site: strength explains little of the jump; it appears as a caveat in \"What was new in 2026\"." } }
- { id: l2-06-pedigree, batch: 2, verdict: undecided, claim: { pt: "Camisa pesa: campeões rendem acima do esperado.", en: "Pedigree counts: past champions beat expectations." }, note: { pt: "Fora do site: inconclusivo.", en: "Not on the site: inconclusive." } }
- { id: l2-07-home, batch: 2, myth: home_advantage, claim: { pt: "Jogar em casa ajuda na Copa.", en: "Playing at home helps at the World Cup." } }
- { id: l2-08-leader-strength, batch: 2, verdict: myth, claim: { pt: "Quem está ganhando por 1 recua (controlando força).", en: "A team leading by one sits back (controlling for strength)." }, note: { pt: "Fora do site: revisa a leitura do mito da 1ª leva; o texto de lá diz só que não há sinal de recuo.", en: "Not on the site: it revises the reading of the batch-1 myth, whose page now says only that there is no sign of sitting back." } }
- { id: l2-09-roller-coaster, batch: 2, verdict: "true", claim: { pt: "O futebol de seleções ficou mais montanha-russa.", en: "International football has become more of a roller-coaster." }, note: { pt: "Fora do site: efeito pequeno, medido em jogos fora das Copas.", en: "Not on the site: a small effect, measured in matches outside World Cups." } }
- { id: l2-10-must-score, batch: 2, myth: must_score_kick, claim: { pt: "A cobrança que precisa entrar treme.", en: "The kick that must go in trembles." } }
- { id: l2-11-rest, batch: 2, verdict: undecided, claim: { pt: "Descanso decide o mata-mata.", en: "Rest decides knockout matches." }, note: { pt: "Fora do site: inconclusivo.", en: "Not on the site: inconclusive." } }
