            ref: { table: myth_opener_loss, where: { era: 48-teams, result: L }, field: value }
            focus: true
  pt:
    claim: "Com 48 seleções, perder a estreia deixou de ser sentença."
    big: "{l48}"
    caption: "de quem perdeu a estreia em 2026 avançou. Com 32 seleções, eram {l32}."
    page:
      title: "Perder a estreia pesa menos quando os terceiros também avançam."
      lede: "Com 32 seleções, quase todo mundo que perdia a estreia voltava para casa. Com 48, e antes com 24, os melhores terceiros também passam, e a derrota inicial deixa de ser sentença."
      chartTitle: "Quem perdeu a estreia e ainda avançou"
      chartNote: "Por formato da Copa, de 1986 a 2026."
      facts:
        - big: "{l48}"
          text: "de quem perdeu a estreia em 2026 avançou ({k48} de {n48})."
        - big: "{l32}"
          text: "com 32 seleções, de 1998 a 2022 ({k32} de {n32})."
        - big: "{l24}"
          text: "com 24 seleções, que também classificava terceiros, de 1986 a 1994 ({k24} de {n24})."
      method:
        - label: "Base"
          text: "a estreia de cada seleção em cada Copa de 1986 a 2026; avançou quem jogou o mata-mata."
        - label: "Regra, escrita antes de olhar os dados"
          text: "verdade se a diferença entre 48 e 32 seleções tivesse intervalo acima de zero. Ficou de {low} a {high} pontos, acima de zero, mas no limite: em 2026 foram só {n48} seleções que perderam a estreia."
        - label: "Leitura"
          text: "a pergunta é sobre o formato, por isso a regra das duas metades da história não se aplica."
  en:
    claim: "With 48 teams, losing the opener is no longer fatal."
    big: "{l48}"
    caption: "of the teams that lost their opener in 2026 went through. With 32 teams, it was {l32}."
    page:
      title: "Losing the opener matters less when third-placed teams go through too."
      lede: "With 32 teams, almost everyone who lost the opener went home. With 48, and earlier with 24, the best third-placed teams also go through, and the opening defeat stops being fatal."
      chartTitle: "Teams that lost the opener and still went through"
      chartNote: "By tournament format, 1986 to 2026."
      facts:
        - big: "{l48}"
          text: "of teams that lost their opener in 2026 went through ({k48} of {n48})."
        - big: "{l32}"
          text: "with 32 teams, from 1998 to 2022 ({k32} of {n32})."
        - big: "{l24}"
          text: "with 24 teams, which also let third-placed teams through, from 1986 to 1994 ({k24} of {n24})."
      method:
        - label: "Base"
          text: "each team's opening match at each World Cup from 1986 to 2026; going through means playing in the knockout."
        - label: "Rule, written before looking at the data"
          text: "true if the 48-team minus 32-team difference had an interval above zero. It ran from {low} to {high} points, above zero but borderline: only {n48} teams lost their opener in 2026."
        - label: "Reading"
          text: "the question is about the format, so the rule of both halves of the history does not apply."
