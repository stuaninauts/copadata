# Mitos publicados (ADR 0008), na ordem da série (ADR 0010): primeiro os mitos, depois as verdades.
# Números só por referência ao export ({nome} no texto -> stats.nome); referência quebrada quebra o build.
# Conteúdo sob CC-BY-SA 4.0 (REUSE.toml).

- id: two_nil
  order: 1
  slug: { pt: 2-a-0, en: two-nil }
  verdict: { table: myths, where: { myth: two_nil }, field: verdict }
  stats:
    after20: { table: myth_two_nil, where: { case: "2-0" }, field: value, format: pct }
    ref20: { table: myth_two_nil, where: { case: "2-0" }, field: reference, format: pct }
    n20: { table: myth_two_nil, where: { case: "2-0" }, field: n, format: int }
    after21: { table: myth_two_nil, where: { case: "2-1 after 2-0" }, field: value, format: pct }
    ref21: { table: myth_two_nil, where: { case: "2-1 after 2-0" }, field: reference, format: pct }
    n21: { table: myth_two_nil, where: { case: "2-1 after 2-0" }, field: n, format: int }
    effect: { table: myths, where: { myth: two_nil }, field: effect, format: pp }
    low: { table: myths, where: { myth: two_nil }, field: ci_low, format: pp }
    high: { table: myths, where: { myth: two_nil }, field: ci_high, format: pp }
    threshold: { table: myths, where: { myth: two_nil }, field: threshold, format: pp_abs }
  chart:
    kind: bars
    max: 0.32
    format: pct
    panels:
      - title: { pt: "Depois de abrir 2 a 0", en: "After going 2-0 up" }
        note: { pt: "{after20} de quem abriu 2 a 0 não venceu.", en: "{after20} of teams that went 2-0 up did not win." }
        bars:
          - label: { pt: "Abriu 2 a 0", en: "Went 2-0 up" }
            ref: { table: myth_two_nil, where: { case: "2-0" }, field: value }
            focus: true
          - label: { pt: "Estava 1 a 0, mesmo minuto", en: "1-0 up, same minute" }
            ref: { table: myth_two_nil, where: { case: "2-0" }, field: reference }
      - title: { pt: "Depois que o adversário diminuiu para 2 a 1", en: "After the opponent pulled one back to 2-1" }
        note: { pt: "{after21} de quem viu o 2 a 0 virar 2 a 1 não venceu.", en: "{after21} of teams whose 2-0 became 2-1 did not win." }
        bars:
          - label: { pt: "Estava 2 a 1", en: "2-1 up" }
            ref: { table: myth_two_nil, where: { case: "2-1 after 2-0" }, field: value }
            focus: true
          - label: { pt: "Estava 1 a 0, mesmo minuto", en: "1-0 up, same minute" }
            ref: { table: myth_two_nil, where: { case: "2-1 after 2-0" }, field: reference }
  pt:
    claim: "2 a 0 é o placar mais perigoso."
    big: "{after20}"
    caption: "de quem abriu 2 a 0 deixou de vencer. Quem estava 1 a 0 no mesmo minuto: {ref20}."
    page:
      title: "Quem abre 2 a 0 quase nunca deixa escapar."
      lede: "Nem quando o adversário diminui. O placar perigoso, se existe um, é o 1 a 0."
      chartTitle: "Quantas vezes quem estava na frente deixou de vencer"
      chartNote: "Cada caso comparado com times que estavam 1 a 0 no mesmo minuto. Copas de 1986 a 2026, resultado aos 90'."
      facts:
        - big: "{after20}"
          text: "dos times que abriram 2 a 0 não venceram. Com 1 a 0 no mesmo minuto, {ref20}."
        - big: "{after21}"
          text: "deixaram escapar depois do 2 a 1. Ainda menos que os {ref21} de quem segura um 1 a 0 no mesmo minuto."
        - big: "{n20}"
          text: "jogos desde 1986 em que alguém abriu 2 a 0. Em {n21} deles, o adversário diminuiu."
      method:
        - label: "Base"
          text: "jogos de grupo e mata-mata das Copas de 1986 a 2026, sem a disputa de 3º lugar: {n20} com um 2 a 0, {n21} deles com o 2 a 1 logo depois."
        - label: "Comparação justa"
          text: "cada caso é comparado com times que estavam 1 a 0 ao fim do mesmo minuto (em faixas de 15 minutos), porque segurar uma vantagem depende de quanto jogo ainda falta."
        - label: "Regra, escrita antes de olhar os dados"
          text: "a frase seria verdade se, depois do 2 a 1, deixar de vencer fosse pelo menos {threshold} pontos mais comum que no 1 a 0. A diferença foi de {effect} pontos (intervalo de {low} a {high}). Mito."
        - label: "Lista fechada"
          text: "esta frase faz parte de uma lista testada de uma vez, com a regra definida antes. Todas as frases são publicadas, inclusive as que não deram em nada."
  en:
    claim: "2-0 is the most dangerous lead."
    big: "{after20}"
    caption: "of teams that went 2-0 up failed to win. Teams 1-0 up at the same minute: {ref20}."
    page:
      title: "Teams that go 2-0 up almost never let it slip."
      lede: "Not even when the opponent pulls one back. If any score is dangerous, it is 1-0."
      chartTitle: "How often the team in front failed to win"
      chartNote: "Each case against teams that were 1-0 up at the same minute. World Cups 1986 to 2026, result at 90 minutes."
      facts:
        - big: "{after20}"
          text: "of teams that went 2-0 up did not win. At 1-0 at the same minute, {ref20}."
        - big: "{after21}"
          text: "let it slip after it became 2-1. Still fewer than the {ref21} of teams holding a 1-0 lead at the same minute."
        - big: "{n20}"
          text: "matches since 1986 where someone went 2-0 up. In {n21} of them, the opponent pulled one back."
      method:
        - label: "Base"
          text: "group and knockout matches of the 1986 to 2026 World Cups, third-place matches excluded: {n20} with a 2-0, {n21} of them followed by a 2-1."
        - label: "A fair comparison"
          text: "each case is compared with teams that were 1-0 up at the end of the same minute (in 15-minute bands), because holding a lead depends on how much time is left."
        - label: "Rule, written before looking at the data"
          text: "the claim would be true if, after the 2-1, failing to win were at least {threshold} points more common than at 1-0. The difference was {effect} points (interval {low} to {high}). Myth."
        - label: "Closed list"
          text: "this claim is part of a list tested in one go, with the rule set in advance. Every claim is published, including the ones that came to nothing."

- id: favorite_knockout
  order: 2
  slug: { pt: favorito-no-mata-mata, en: favorite-in-the-knockout }
  verdict: { table: myths, where: { myth: favorite_knockout }, field: verdict }
  stats:
    result: { table: myth_favorite_knockout, where: { stage: knockout }, field: result, format: pct }
    expected: { table: myth_favorite_knockout, where: { stage: knockout }, field: expected, format: pct }
    gresult: { table: myth_favorite_knockout, where: { stage: groups }, field: result, format: pct }
    gexpected: { table: myth_favorite_knockout, where: { stage: groups }, field: expected, format: pct }
    nko: { table: myth_favorite_knockout, where: { stage: knockout }, field: n, format: int }
    ngroups: { table: myth_favorite_knockout, where: { stage: groups }, field: n, format: int }
    effect: { table: myths, where: { myth: favorite_knockout }, field: effect, format: pp }
    low: { table: myths, where: { myth: favorite_knockout }, field: ci_low, format: pp }
    high: { table: myths, where: { myth: favorite_knockout }, field: ci_high, format: pp }
    threshold: { table: myths, where: { myth: favorite_knockout }, field: threshold, format: pp_abs }
  chart:
    kind: bars
    max: 0.85
    format: pct
    panels:
      - title: { pt: "No mata-mata", en: "In the knockout" }
        note: { pt: "O favorito fez {result}; a força previa {expected}.", en: "The favorite got {result}; strength predicted {expected}." }
        bars:
          - label: { pt: "O favorito fez", en: "Favorite got" }
            ref: { table: myth_favorite_knockout, where: { stage: knockout }, field: result }
            focus: true
          - label: { pt: "A força previa", en: "Strength predicted" }
            ref: { table: myth_favorite_knockout, where: { stage: knockout }, field: expected }
      - title: { pt: "Na fase de grupos", en: "In the group stage" }
        note: { pt: "O favorito fez {gresult}; a força previa {gexpected}.", en: "The favorite got {gresult}; strength predicted {gexpected}." }
        bars:
          - label: { pt: "O favorito fez", en: "Favorite got" }
            ref: { table: myth_favorite_knockout, where: { stage: groups }, field: result }
            focus: true
          - label: { pt: "A força previa", en: "Strength predicted" }
            ref: { table: myth_favorite_knockout, where: { stage: groups }, field: expected }
  pt:
    claim: "Na Copa, o favorito sofre no mata-mata."
    big: "{result}"
    caption: "de aproveitamento do favorito no mata-mata (empate vale meio), acima dos {expected} que a força previa."
    page:
      title: "No mata-mata, o favorito rende mais, não menos."
      lede: "Comparado com o que a força das seleções previa, o favorito vai melhor nos jogos eliminatórios do que na fase de grupos."
      chartTitle: "Aproveitamento do favorito contra o que a força previa"
      chartNote: "Resultado aos 90 minutos: vitória vale 1, empate vale meio. Copas de 1986 a 2026."
      facts:
        - big: "{result}"
          text: "de aproveitamento do favorito no mata-mata. A força previa {expected}."
        - big: "{gresult}"
          text: "na fase de grupos, praticamente igual aos {gexpected} previstos."
        - big: "{nko}"
          text: "jogos de mata-mata desde 1986, sem a disputa de 3º lugar, contra {ngroups} de grupo."
      method:
        - label: "Força"
          text: "o Elo de cada seleção antes do jogo, calculado a partir de todos os jogos entre seleções desde 1872 (base pública de resultados, domínio público)."
        - label: "Previsto"
          text: "o resultado esperado pela diferença de Elo, como se o jogo fosse em campo neutro; favorito é quem tem o Elo maior."
        - label: "Regra, escrita antes de olhar os dados"
          text: "a frase seria verdade se o favorito rendesse pelo menos {threshold} pontos menos, frente ao previsto, no mata-mata do que nos grupos. A diferença (grupos menos mata-mata) foi de {effect} pontos, intervalo de {low} a {high}: o favorito rende mais no mata-mata. Mito."
  en:
    claim: "At the World Cup, the favorite struggles in the knockout."
    big: "{result}"
    caption: "of the points available went to the favorite in the knockout (a draw counts half), above the {expected} its strength predicted."
    page:
      title: "In the knockout, the favorite does better, not worse."
      lede: "Measured against what team strength predicted, favorites do better in knockout matches than in the group stage."
      chartTitle: "The favorite's results against what strength predicted"
      chartNote: "Result at 90 minutes: a win counts 1, a draw half. World Cups 1986 to 2026."
      facts:
        - big: "{result}"
          text: "of the points available went to the favorite in the knockout. Strength predicted {expected}."
        - big: "{gresult}"
          text: "in the group stage, almost the same as the {gexpected} predicted."
        - big: "{nko}"
          text: "knockout matches since 1986, third-place matches excluded, against {ngroups} group matches."
      method:
        - label: "Strength"
          text: "each team's Elo rating before the match, computed from every international match since 1872 (a public-domain results database)."
        - label: "Predicted"
          text: "the expected result from the Elo difference, as if on neutral ground; the favorite is the team with the higher Elo."
        - label: "Rule, written before looking at the data"
          text: "the claim would be true if, against its prediction, the favorite did at least {threshold} points worse in the knockout than in the group stage. The difference (groups minus knockout) was {effect} points, interval {low} to {high}: the favorite does better in the knockout. Myth."

- id: late_specialists
  order: 3
  slug: { pt: especialista-no-fim, en: late-specialists }
  verdict: { table: myths, where: { myth: late_specialists }, field: verdict }
  stats:
    outside: { table: myths, where: { myth: late_specialists }, field: effect, format: int }
    teams: { table: myth_late_specialists, where: { direction: scored }, agg: count, format: int }
    out95: { table: myth_late_specialists, where: { z: { abs_gt: 1.96 } }, agg: count, format: int }
    mean: { table: myth_late_specialists, where: { direction: scored }, field: mean, agg: max, format: pct }
    aut_k: { table: myth_late_specialists, where: { direction: scored, team: Austria }, field: k, format: int }
    aut_n: { table: myth_late_specialists, where: { direction: scored, team: Austria }, field: n, format: int }
    irn_k: { table: myth_late_specialists, where: { direction: scored, team: Iran }, field: k, format: int }
    irn_n: { table: myth_late_specialists, where: { direction: scored, team: Iran }, field: n, format: int }
  chart:
    kind: funnel
    panels:
      - title: { pt: "Gols marcados do 76' em diante", en: "Goals scored from the 76th minute" }
        note: { pt: "Cada ponto é uma seleção. Linhas tracejadas: limites de 95% e de 99,8% para o seu número de gols.", en: "Each dot is a team. Dashed lines: the 95% and 99.8% limits for its number of goals." }
        direction: scored
      - title: { pt: "Gols sofridos do 76' em diante", en: "Goals conceded from the 76th minute" }
        note: { pt: "Nenhuma seleção sai nem do limite de 95%.", en: "No team is outside even the 95% limit." }
        direction: conceded
  pt:
    claim: "Tem seleção especialista em decidir no fim."
    big: "{outside} de {teams}"
    caption: "seleções mais frequentes fogem do que o acaso explica, nos gols marcados ou sofridos no fim."
    page:
      title: "Nenhuma seleção decide no fim mais do que o acaso explica."
      lede: "Com poucos gols, qualquer seleção pode parecer especialista. Levando em conta quantos gols cada uma fez, todas cabem no esperado."
      chartTitle: "Parcela dos gols de cada seleção que saiu no fim"
      chartNote: "Seleções com pelo menos 10 jogos em Copas, de 1986 a 2026. Em média, {mean} dos gols saem do 76' em diante."
      facts:
        - big: "{outside}"
          text: "seleções fora do limite de 99,8%, nos gols marcados ou sofridos no fim."
        - big: "{out95}"
          text: "fora do limite de 95%: Áustria ({aut_k} de {aut_n} gols no fim) e Irã ({irn_k} de {irn_n}). Com tantas seleções, o acaso sozinho põe algumas ali."
        - big: "{mean}"
          text: "dos gols de todas elas saem do 76' em diante. É a régua do gráfico."
      method:
        - label: "Base"
          text: "as {teams} seleções com pelo menos 10 jogos em Copas de 1986 a 2026; gols do tempo normal, a favor e contra."
        - label: "No fim"
          text: "do 76' até o fim dos acréscimos do 2º tempo; a prorrogação fica fora."
        - label: "Os limites"
          text: "a faixa onde cairia uma seleção comum com o mesmo número de gols. Quem tem poucos gols oscila mais, por isso a faixa abre à esquerda."
        - label: "Regra, escrita antes de olhar os dados"
          text: "a frase seria verdade se alguma seleção saísse do limite de 99,8%. Nenhuma saiu. Mito."
  en:
    claim: "Some teams are specialists in deciding late."
    big: "{outside} of {teams}"
    caption: "of the most frequent teams are beyond what chance explains, for late goals scored or conceded."
    page:
      title: "No team decides late more than chance explains."
      lede: "With few goals, any team can look like a specialist. Once each team's number of goals is taken into account, all of them fit the expected range."
      chartTitle: "Share of each team's goals that came late"
      chartNote: "Teams with at least 10 World Cup matches, 1986 to 2026. On average, {mean} of goals come from the 76th minute on."
      facts:
        - big: "{outside}"
          text: "teams outside the 99.8% limit, for late goals scored or conceded."
        - big: "{out95}"
          text: "outside the 95% limit: Austria ({aut_k} of {aut_n} goals late) and Iran ({irn_k} of {irn_n}). With this many teams, chance alone puts a few there."
        - big: "{mean}"
          text: "of all their goals come from the 76th minute on. That is the chart's yardstick."
      method:
        - label: "Base"
          text: "the {teams} teams with at least 10 World Cup matches from 1986 to 2026; regulation goals, scored and conceded."
        - label: "Late"
          text: "from the 76th minute to the end of second-half stoppage time; extra time excluded."
        - label: "The limits"
          text: "the range an ordinary team with the same number of goals would fall in. Teams with few goals swing more, so the range opens up to the left."
        - label: "Rule, written before looking at the data"
          text: "the claim would be true if any team fell outside the 99.8% limit. None did. Myth."

- id: leader_sits_back
  order: 4
  slug: { pt: quem-lidera-recua, en: leader-sits-back }
  verdict: { table: myths, where: { myth: leader_sits_back }, field: verdict }
  stats:
    lead: { table: myth_leader_sits_back, where: { state: "lead 1-0" }, field: value, format: dec1 }
    level: { table: myth_leader_sits_back, where: { state: "level 0-0" }, field: value, format: dec1 }
    trail: { table: myth_leader_sits_back, where: { state: "trail 0-1" }, field: value, format: dec1 }
    lead_min: { table: myth_leader_sits_back, where: { state: "lead 1-0" }, field: n, format: int }
    lead_goals: { table: myth_leader_sits_back, where: { state: "lead 1-0" }, field: k, format: int }
  chart:
    kind: bars
    max: 2.6
    format: dec1
    panels:
      - title: { pt: "Gols por 90 minutos, do 76' em diante", en: "Goals per 90 minutes, from the 76th minute" }
        note: { pt: "Cada barra soma todos os minutos jogados naquela situação, em todos os jogos.", en: "Each bar adds up every minute played in that situation, across all matches." }
        bars:
          - label: { pt: "Ganhando 1 a 0", en: "Leading 1-0" }
            ref: { table: myth_leader_sits_back, where: { state: "lead 1-0" }, field: value }
            focus: true
          - label: { pt: "Empatando 0 a 0", en: "Level at 0-0" }
            ref: { table: myth_leader_sits_back, where: { state: "level 0-0" }, field: value }
          - label: { pt: "Perdendo 0 a 1", en: "Trailing 0-1" }
            ref: { table: myth_leader_sits_back, where: { state: "trail 0-1" }, field: value }
  pt:
    claim: "Quem está ganhando por 1 recua."
    big: "{lead} × {level}"
    caption: "gols por 90 minutos, do 76' em diante: quem lidera 1 a 0 contra um time no 0 a 0. Não há sinal de recuo."
    page:
      title: "Não há sinal de que quem lidera por 1 gol recue."
      lede: "No fim do jogo, quem está 1 a 0 marca no mesmo ritmo de um time empatado. E quem perde não passa a marcar mais por estar atrás."
      chartTitle: "Ritmo de gols no fim do jogo, conforme o placar"
      chartNote: "Do 76' até o fim dos acréscimos, Copas de 1986 a 2026."
      facts:
        - big: "{lead}"
          text: "gols por 90 minutos de quem lidera 1 a 0 no fim do jogo."
        - big: "{level}"
          text: "de um time no 0 a 0: quem lidera não marca menos."
        - big: "{trail}"
          text: "de quem perde 0 a 1: estar atrás não faz marcar mais."
      method:
        - label: "Base"
          text: "{lead_min} minutos de times ganhando 1 a 0 do 76' em diante ({lead_goals} gols), e o mesmo para 0 a 0 e 0 a 1, em todos os jogos de grupo e mata-mata de 1986 a 2026."
        - label: "Regra, escrita antes de olhar os dados"
          text: "a frase seria verdade se quem lidera marcasse menos que no 0 a 0 e quem perde marcasse mais, os dois fora do acaso. Nenhuma das duas coisas aconteceu. Mito."
        - label: "Ressalva"
          text: "quem lidera costuma ser o time mais forte. Controlando pela força das seleções, o favorito que lidera marca um pouco menos que o favorito empatado, mas a diferença é pequena demais para dizer que ele recua."
  en:
    claim: "A team leading by one sits back."
    big: "{lead} × {level}"
    caption: "goals per 90 minutes from the 76th minute: a team leading 1-0 against a team at 0-0. No sign of sitting back."
    page:
      title: "No sign that a team leading by one goal sits back."
      lede: "Late in the game, a team 1-0 up scores at the same rate as a team that is level. And a team behind does not start scoring more for being behind."
      chartTitle: "Late scoring rate, by score"
      chartNote: "From the 76th minute to the end of stoppage time, World Cups 1986 to 2026."
      facts:
        - big: "{lead}"
          text: "goals per 90 minutes for a team leading 1-0 late in the game."
        - big: "{level}"
          text: "for a team at 0-0: the leader does not score less."
        - big: "{trail}"
          text: "for a team trailing 0-1: being behind does not make it score more."
      method:
        - label: "Base"
          text: "{lead_min} minutes of teams leading 1-0 from the 76th minute ({lead_goals} goals), and the same for 0-0 and 0-1, across all group and knockout matches from 1986 to 2026."
        - label: "Rule, written before looking at the data"
          text: "the claim would be true if the leader scored less than at 0-0 and the trailing team scored more, both beyond chance. Neither happened. Myth."
        - label: "Caveat"
          text: "the leader is usually the stronger team. Controlling for team strength, a favorite that leads scores a little less than a favorite that is level, but the gap is too small to say it sits back."

- id: home_advantage
  order: 5
  slug: { pt: jogar-em-casa, en: home-advantage }
  verdict: { table: myths, where: { myth: home_advantage }, field: verdict }
  stats:
    above: { table: myth_home_advantage, where: { residual: { gt: 0 } }, agg: count, format: int }
    hosts: { table: myth_home_advantage, agg: count, format: int }
    matches: { table: myth_home_advantage, field: n, agg: sum, format: int }
    effect: { table: myths, where: { myth: home_advantage }, field: effect, format: pp }
    low: { table: myths, where: { myth: home_advantage }, field: ci_low, format: pp }
    high: { table: myths, where: { myth: home_advantage }, field: ci_high, format: pp }
  chart:
    kind: hosts
    panels:
      - title: { pt: "Cada sede contra o que a força previa", en: "Each host against what its strength predicted" }
        note: { pt: "Pontos de aproveitamento por jogo acima (azul) ou abaixo (cinza) do previsto; empate vale meio.", en: "Points per match above (blue) or below (grey) the prediction, in percentage points; a draw counts half." }
  pt:
    claim: "Jogar em casa ajuda na Copa."
    big: "{above} de {hosts}"
    caption: "sedes renderam acima do que a força previa. Brasil 2014 e Catar 2022 estão entre as exceções."
    page:
      title: "As sedes rendem acima do que a força delas previa."
      lede: "Quase todo país-sede foi além do que o seu nível indicava. A vantagem é parecida com a que o Elo já dá a quem joga em casa."
      chartTitle: "Aproveitamento das sedes acima ou abaixo do previsto"
      chartNote: "Resultado aos 90 minutos contra o esperado pela força, como se fosse em campo neutro."
      facts:
        - big: "{effect}"
          text: "pontos de aproveitamento por jogo acima do que a força previa, em média."
        - big: "{above} de {hosts}"
          text: "sedes ficaram acima do previsto. Brasil 2014, Catar 2022 e Canadá 2026 ficaram abaixo."
        - big: "{low} a {high}"
          text: "o intervalo do efeito: mesmo no pior caso, acima de zero."
      method:
        - label: "Base"
          text: "{hosts} sedes desde 1986 (2002 teve duas e 2026 teve três), {matches} jogos de grupo e mata-mata."
        - label: "Força"
          text: "o Elo de cada seleção antes do jogo, calculado a partir de todos os jogos entre seleções desde 1872 (base pública de resultados, domínio público)."
        - label: "Previsto"
          text: "o resultado esperado pela diferença de Elo, sem o bônus de mando: como se a sede jogasse em campo neutro."
        - label: "Regra, escrita antes de olhar os dados"
          text: "verdade se o intervalo ficasse acima de zero e as duas metades da história (1986-2002 e 2006-2026) apontassem para o mesmo lado. As duas apontam. Verdade."
  en:
    claim: "Playing at home helps at the World Cup."
    big: "{above} of {hosts}"
    caption: "hosts did better than their strength predicted. Brazil 2014 and Qatar 2022 are among the exceptions."
    page:
      title: "Hosts do better than their strength predicted."
      lede: "Almost every host country went beyond what its level suggested. The edge is close to the one Elo already gives a home side."
      chartTitle: "Hosts' results above or below the prediction"
      chartNote: "Result at 90 minutes against the expectation from strength, as if on neutral ground."
      facts:
        - big: "{effect}"
          text: "percentage points per match above what strength predicted, on average."
        - big: "{above} of {hosts}"
          text: "hosts finished above the prediction. Brazil 2014, Qatar 2022 and Canada 2026 finished below."
        - big: "{low} to {high}"
          text: "the interval of the effect: above zero even in the worst case."
      method:
        - label: "Base"
          text: "{hosts} hosts since 1986 (2002 had two and 2026 had three), {matches} group and knockout matches."
        - label: "Strength"
          text: "each team's Elo rating before the match, computed from every international match since 1872 (a public-domain results database)."
        - label: "Predicted"
          text: "the expected result from the Elo difference, without the home bonus: as if the host played on neutral ground."
        - label: "Rule, written before looking at the data"
          text: "true if the interval sat above zero and both halves of the history (1986-2002 and 2006-2026) pointed the same way. They do. True."

