          text: "of the kicks where a miss eliminates went in ({kmust} of {nmust})."
        - big: "{other}"
          text: "of the other kicks ({kother} of {nother})."
        - big: "{effect}"
          text: "points apart. The interval runs from {low} to {high}: the gap is real, but it may be small."
