          text: "of decided group matches in 2026 were won by one goal ({k26} of {n26})."
        - big: "{band_low} to {band_high}"
          text: "the range of World Cups drawn at random from the history. 2026 fell below it."
        - big: "{big}"
          text: "of group matches were big wins: a record, but at the edge of chance."
